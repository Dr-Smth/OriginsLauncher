name: Source and audio checks
on:
  # Manual only. Runner charges depend on repository visibility and the account
  # plan/allowance. Enable automatic triggers deliberately.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Tests and clean-source audit
        run: |
          python3 -B -m unittest discover -s source/tests -v
          python3 -B scripts/audit_release.py
      # App/release checks need the separately provisioned, hash-pinned audio
      # binary and matching source archive. Do not imply these checks build or
      # validate a release app/installer, or fetch an unpinned replacement.
      - name: Audio policy and adapter checks
        env:
          ORIGINS_AUDIO_TEST_OUTPUT: ${{ runner.temp }}/origins-audio-tests
        run: |
          python3 -B audio-compat/tests/test_policy.py
          python3 -B audio-compat/tests/test_adapter.py
